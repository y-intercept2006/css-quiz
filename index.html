<html lang="en">
<head>

  <title>CSS Written Exam Interactive Reviewer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --correct: #22c55e;
      --incorrect: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .container { max-width: 760px; width: 100%; }
    
    header { margin-bottom: 24px; text-align: center; }
    h1 { font-size: 1.6rem; color: var(--accent); margin-bottom: 8px; }
    p.subtitle { color: var(--text-muted); font-size: 0.9rem; }

    .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    select, button { padding: 10px 14px; background: var(--card-bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; cursor: pointer; }
    button:hover, select:hover { border-color: var(--accent); }

    .score-banner { background: var(--card-bg); padding: 16px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-align: center; border: 1px solid var(--border); }
    .score-value { font-size: 1.1rem; font-weight: bold; color: var(--accent); }

    .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); }
    .q-number { font-size: 0.8rem; color: var(--accent); font-weight: bold; margin-bottom: 6px; text-transform: uppercase; }
    .q-text { font-size: 1rem; font-weight: 600; margin-bottom: 16px; line-height: 1.4; }

    .options { display: flex; flex-direction: column; gap: 10px; }
    .option-btn { width: 100%; text-align: left; padding: 12px 16px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 0.95rem; transition: all 0.2s; cursor: pointer; }
    .option-btn:hover:not(:disabled) { border-color: var(--accent); background: #1e293b; }
    
    .option-btn.correct { background: rgba(34, 197, 94, 0.2) !important; border-color: var(--correct) !important; color: #4ade80; }
    .option-btn.incorrect { background: rgba(239, 68, 68, 0.2) !important; border-color: var(--incorrect) !important; color: #f87171; }

    /* RJ45 Wiring Section Styles */
    .wire-slots { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-top: 12px; }
    .slot { background: #0f172a; border: 2px dashed var(--border); border-radius: 8px; height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px; }
    .slot-num { font-size: 0.7rem; color: var(--text-muted); font-weight: bold; }
    .wire-palette { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; padding: 12px; background: #0f172a; border-radius: 8px; border: 1px solid var(--border); }
    
    .wire-btn { padding: 8px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; border: 1px solid var(--border); }
    .wire-chip { width: 100%; height: 60px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: bold; text-align: center; cursor: pointer; }

    /* Wire Colors */
    .wg { background: linear-gradient(135deg, #ffffff 50%, #22c55e 50%); color: #000; border: 1px solid #22c55e; }
    .g  { background: #22c55e; color: #fff; }
    .wo { background: linear-gradient(135deg, #ffffff 50%, #f97316 50%); color: #000; border: 1px solid #f97316; }
    .b  { background: #3b82f6; color: #fff; }
    .wb { background: linear-gradient(135deg, #ffffff 50%, #3b82f6 50%); color: #000; border: 1px solid #3b82f6; }
    .o  { background: #f97316; color: #fff; }
    .wbr{ background: linear-gradient(135deg, #ffffff 50%, #78350f 50%); color: #000; border: 1px solid #78350f; }
    .br { background: #78350f; color: #fff; }

    .action-btn { margin-top: 14px; width: 100%; padding: 12px; background: var(--accent); color: #0f172a; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>

// RJ45 Standards & Unorganized/Disorganized Colors
const wiringStandards = {
  "T568A": ["White Green", "Green", "White Orange", "Blue", "White Blue", "Orange", "White Brown", "Brown"],
  "T568B": ["White Orange", "Orange", "White Green", "Blue", "White Blue", "Green", "White Brown", "Brown"]
};

// Explicitly unorganized palette array
const unorganizedWireChoices = [
  "Brown", "White Orange", "Green", "White Blue", "Orange", "White Green", "White Brown", "Blue"
];

const wireClasses = {
  "White Green": "wg", "Green": "g", "White Orange": "wo", "Blue": "b",
  "White Blue": "wb", "Orange": "o", "White Brown": "wbr", "Brown": "br"
};

let userAnswers = {};
let currentWiringSlots = { "T568A": Array(8).fill(null), "T568B": Array(8).fill(null) };
let activeWiringStandard = "T568A";

function renderQuiz() {
  const container = document.getElementById('quizContainer');
  const section = document.getElementById('sectionFilter').value;
  container.innerHTML = '';

  if (section === "wiring") {
    renderWiringActivity(container);
    return;
  }

  const filtered = section === 'all' 
    ? quizData 
    : quizData.filter(item => item.section == section);

  let correctCount = 0;
  let answeredCount = 0;

  filtered.forEach((item, index) => {
    const originalIndex = quizData.indexOf(item);
    const card = document.createElement('div');
    card.className = 'card';

    const qNum = document.createElement('div');
    qNum.className = 'q-number';
    qNum.innerText = item.section === 'acronyms' 
      ? `Acronym Quiz • Question ${index + 1}` 
      : `Page ${item.section} • Question ${index + 1}`;

    const qText = document.createElement('div');
    qText.className = 'q-text';
    qText.innerText = item.q;

    const optsDiv = document.createElement('div');
    optsDiv.className = 'options';

    const selected = userAnswers[originalIndex];
    if (selected !== undefined) answeredCount++;
    if (selected === item.answer) correctCount++;

    item.options.forEach((opt, optIdx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = `${String.fromCharCode(65 + optIdx)}) ${opt}`;

      if (selected !== undefined) {
        btn.disabled = true;
        if (optIdx === item.answer) btn.classList.add('correct');
        if (selected === optIdx && selected !== item.answer) btn.classList.add('incorrect');
      } else {
        btn.onclick = () => selectAnswer(originalIndex, optIdx);
      }

      optsDiv.appendChild(btn);
    });

    card.appendChild(qNum);
    card.appendChild(qText);
    card.appendChild(optsDiv);
    container.appendChild(card);
  });

  document.getElementById('scoreDisplay').innerText = `${correctCount} / ${filtered.length} (Answered: ${answeredCount})`;
}

function renderWiringActivity(container) {
  document.getElementById('scoreDisplay').innerText = "RJ45 Wiring Practice";

  const card = document.createElement('div');
  card.className = 'card';
  
  card.innerHTML = `
    <div class="q-number">Color Coding Activity</div>
    <div class="q-text">Arrange the 8 wires in order for ${activeWiringStandard} (Pin 1 to Pin 8):</div>
    
    <div style="margin-bottom: 16px; display: flex; gap: 10px;">
      <button onclick="switchWiringStandard('T568A')" style="${activeWiringStandard==='T568A'?'border-color:var(--accent);color:var(--accent);':''}">T568-A Standard</button>
      <button onclick="switchWiringStandard('T568B')" style="${activeWiringStandard==='T568B'?'border-color:var(--accent);color:var(--accent);':''}">T568-B Standard</button>
    </div>

    <div class="wire-slots" id="slotsGrid"></div>

    <div class="q-text" style="margin-top: 20px; font-size: 0.85rem; color: var(--text-muted);">Select wires from the unorganized palette to insert into Pin 1 to Pin 8:</div>
    <div class="wire-palette" id="wirePalette"></div>

    <button class="action-btn" onclick="checkWiring()">Check ${activeWiringStandard} Order</button>
    <button onclick="resetCurrentWiring()" style="margin-top:10px; width:100%;">Clear Pin Slots</button>
  `;

  container.appendChild(card);
  updateSlotsUI();
  updatePaletteUI();
}

function updateSlotsUI() {
  const grid = document.getElementById('slotsGrid');
  if(!grid) return;
  grid.innerHTML = '';

  currentWiringSlots[activeWiringStandard].forEach((wire, idx) => {
    const slot = document.createElement('div');
    slot.className = 'slot';
    
    if(wire) {
      slot.innerHTML = `<span class="slot-num">Pin ${idx+1}</span>
                        <div class="wire-chip ${wireClasses[wire]}" onclick="removeWireFromSlot(${idx})">${wire}</div>`;
    } else {
      slot.innerHTML = `<span class="slot-num">Pin ${idx+1}</span><span style="font-size:0.65rem; color:var(--text-muted)">Empty</span>`;
    }
    grid.appendChild(slot);
  });
}

function updatePaletteUI() {
  const palette = document.getElementById('wirePalette');
  if(!palette) return;
  palette.innerHTML = '';

  // Render palette in unorganized order
  unorganizedWireChoices.forEach(wire => {
    const btn = document.createElement('button');
    btn.className = `wire-btn ${wireClasses[wire]}`;
    btn.innerText = wire;
    btn.onclick = () => addWireToSlot(wire);
    palette.appendChild(btn);
  });
}

function addWireToSlot(wire) {
  const slots = currentWiringSlots[activeWiringStandard];
  const emptyIdx = slots.indexOf(null);
  if (emptyIdx !== -1) {
    slots[emptyIdx] = wire;
    updateSlotsUI();
  }
}

function removeWireFromSlot(idx) {
  currentWiringSlots[activeWiringStandard][idx] = null;
  updateSlotsUI();
}

function resetCurrentWiring() {
  currentWiringSlots[activeWiringStandard] = Array(8).fill(null);
  updateSlotsUI();
}

function switchWiringStandard(std) {
  activeWiringStandard = std;
  renderQuiz();
}

function checkWiring() {
  const slots = currentWiringSlots[activeWiringStandard];
  const correct = wiringStandards[activeWiringStandard];
  
  if (slots.includes(null)) {
    alert("Please fill all 8 pin slots before checking!");
    return;
  }

  let isCorrect = true;
  for (let i = 0; i < 8; i++) {
    if (slots[i] !== correct[i]) {
      isCorrect = false;
      break;
    }
  }

  if (isCorrect) {
    alert(`🎉 Correct! Perfect pinout sequence for ${activeWiringStandard}!`);
  } else {
    alert(`❌ Incorrect order. The correct sequence for ${activeWiringStandard} is:\n\n` + correct.map((w, i) => `Pin ${i+1}: ${w}`).join('\n'));
  }
}

function selectAnswer(qIndex, optIndex) {
  userAnswers[qIndex] = optIndex;
  renderQuiz();
}

function filterSection() {
  renderQuiz();
}

function resetQuiz() {
  userAnswers = {};
  currentWiringSlots = { "T568A": Array(8).fill(null), "T568B": Array(8).fill(null) };
  renderQuiz();
}

renderQuiz();
</script>
